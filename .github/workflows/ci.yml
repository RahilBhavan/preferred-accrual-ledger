name: Offline ledger checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.14.0'
      - name: Restore frozen public sources
        run: python scripts/snapshot.py
      - name: Check source hashes, behavior and repeatable demos offline
        run: python scripts/validate.py
      - name: Check syntax
        run: python -m compileall -q ledger scripts tests
      - name: Rebuild result artifacts and check for drift
        run: |
          python scripts/figure.py
          git diff --exit-code -- docs/reconciliation.svg docs/result.html
